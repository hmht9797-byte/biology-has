<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--bg)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg)}
.cv svg{position:absolute;left:0;top:0}
.slab{fill:var(--emerald-900)}.brand{fill:var(--brand)}.tint{fill:var(--emerald-200)}.gold{fill:var(--accent)}
.ring{fill:none;stroke:var(--accent);stroke-width:4}.org{fill:var(--emerald-200)}.nuc{fill:var(--accent)}
.blk{rx:var(--radius-lg);ry:var(--radius-lg)}
.tx{position:absolute;right:40px;bottom:36px;max-width:440px;text-align:right}
.tx h1{margin:0;font:800 64px/.98 var(--font-head);color:var(--text);letter-spacing:0}
.tx p{margin:14px 0 0;font:400 14px/1.6 var(--font-body);color:var(--text-muted)}
</style></head><body><div class="cv">
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
<!-- blocks: emerald-900 240x288 (bleeds top, bottom and the outer edge), brand 200x136 radius-lg, emerald-200 104x88 radius-lg, accent disc 88 (r = half)
     arrangement: right-to-left mirror of the cover skeleton, one tall slab with three satellites inside x 0-480, the name bottom-right on the ground
     pattern: a literal motif, the cell, because the brand mark is a cell under a gold microscope: membrane ring, gold nucleus, three organelles (5 units)
     scales: gaps space-6 (24) and space-4 (16); corners radius-lg (22); disc and ring radii are halves of 88 and 176 -->
<rect class="slab" x="0" y="0" width="240" height="288"/>
<circle class="ring" cx="120" cy="144" r="88"/><circle class="nuc" cx="98" cy="122" r="28"/>
<circle class="org" cx="160" cy="186" r="9"/><circle class="org" cx="70" cy="196" r="7"/><circle class="org" cx="168" cy="96" r="6"/>
<rect class="brand blk" x="264" y="24" width="200" height="136"/>
<circle class="gold" cx="308" cy="220" r="44"/>
<rect class="tint blk" x="368" y="176" width="96" height="88"/>
</svg>
<div class="tx"><h1>ملازم الأحياء<br>التفاعلية</h1><p>ملازم أحياء تفاعلية من الأول المتوسط إلى السادس العلمي، تعمل دون إنترنت.</p></div>
</div></body></html>
